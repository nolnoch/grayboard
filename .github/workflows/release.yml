name: Release

# Tag pushes only: no manual trigger, so no branch run can reach the release
# environment's signing key (#162).
on:
  push:
    tags:
      - "v*"

# Read-only by default; only the publish job can write (it creates the release).
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `grayboard update` checks the downloaded binary reports the tag's version.
      - name: Tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(jq -r .version package.json)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG doesn't match package.json version $version"
            exit 1
          fi

      - uses: ./.github/actions/setup
        with:
          node: "true"
          release-cache: "true"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # the upgrade tests list releases; lifts the anonymous rate limit
        run: bun test

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            bun_target: bun-linux-x64
          - target: linux-arm64
            bun_target: bun-linux-arm64
          - target: darwin-x64
            bun_target: bun-darwin-x64
          - target: darwin-arm64
            bun_target: bun-darwin-arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Compile binaries for ${{ matrix.target }}
        run: |
          mkdir -p dist
          bash scripts/build_scratch.sh bun build --compile --target=${{ matrix.bun_target }} "$GITHUB_WORKSPACE/src/cli/main.ts"    --outfile "$GITHUB_WORKSPACE/dist/grayboard-${{ matrix.target }}"
          bash scripts/build_scratch.sh bun build --compile --target=${{ matrix.bun_target }} "$GITHUB_WORKSPACE/src/server/main.ts" --outfile "$GITHUB_WORKSPACE/dist/grayboard-server-${{ matrix.target }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # The compiled binaries, before they're published: --version, the pi
  # scenario and a server round trip (tests/e2e/binaries.e2e.ts).
  e2e:
    name: E2E ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: darwin-arm64
            runner: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          node: "true"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries-${{ matrix.target }}
          path: dist

      - name: Binaries suite
        env:
          GRAYBOARD_E2E_BIN_DIR: ${{ github.workspace }}/dist
          GRAYBOARD_E2E_TAG: ${{ github.ref_name }}
          GRAYBOARD_E2E_RUN_DIR: ${{ runner.temp }}/e2e-run
        run: |
          chmod +x dist/*   # artifacts don't keep the executable bit
          scripts/e2e.sh binaries

      - name: Upload run dir
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-binaries-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-run
          retention-days: 7
          if-no-files-found: warn

  # Every v1.x release's databases and installs upgrade to this tree.
  upgrade-matrix:
    name: Upgrade matrix
    permissions:
      contents: read
      issues: write   # e2e.yml's tracking-issue job asks for it; that job runs only on schedule
    uses: ./.github/workflows/e2e.yml
    with:
      suite: upgrade-matrix

  # Signs SHA256SUMS with the release key, which only the `release`
  # environment holds: a v* tag run its required reviewer approves (#162).
  release:
    name: Publish release
    needs: [build, e2e, upgrade-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write          # creates the release
      id-token: write          # the attestation's Sigstore certificate
      attestations: write
      artifact-metadata: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The binaries only: the e2e jobs' run dirs are artifacts too.
      - name: Download the binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true

      # The tag line binds the signature to this release; names sort in C order.
      - name: Write SHA256SUMS
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cp install.sh dist/
          cp deploy/grayboard.service dist/deploy-grayboard.service
          cp deploy/Caddyfile dist/deploy-Caddyfile
          cp deploy/backup.sh dist/deploy-backup.sh
          cd dist
          { echo "# grayboard ${TAG}"; sha256sum grayboard-* install.sh deploy-* | LC_ALL=C sort -k2; } > SHA256SUMS
          cat SHA256SUMS

      - name: Sign SHA256SUMS
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          key="$RUNNER_TEMP/release-signing.key"
          (umask 077 && printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key")
          id="$(openssl pkey -in "$key" -pubout -outform DER | sha256sum | cut -c1-16)"
          openssl dgst -sha256 -sign "$key" -out "$RUNNER_TEMP/sig.der" dist/SHA256SUMS
          echo "$id $(openssl base64 -A -in "$RUNNER_TEMP/sig.der")" > dist/SHA256SUMS.sig
          echo "signed with key $id"

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release-signing.key"

      # A wrong secret fails the release here, not on users' machines: the
      # signature must verify against the committed key file of its id.
      - name: Verify the signature against assets/release-keys
        run: |
          read -r id b64 < dist/SHA256SUMS.sig
          pub="assets/release-keys/${id}.pem"
          [ -f "$pub" ] || { echo "::error::key $id isn't in assets/release-keys"; exit 1; }
          [ "$(openssl pkey -pubin -in "$pub" -outform DER | sha256sum | cut -c1-16)" = "$id" ] || { echo "::error::$pub isn't key $id"; exit 1; }
          printf '%s' "$b64" | openssl base64 -d -A > "$RUNNER_TEMP/check.der"
          openssl dgst -sha256 -verify "$pub" -signature "$RUNNER_TEMP/check.der" dist/SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/grayboard-*
            dist/install.sh
            dist/deploy-*
            dist/SHA256SUMS

      # Hand-written notes for this tag, when the release needs them (the
      # first signed release does), go above the generated ones.
      - name: Find release notes
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          f=".github/release-notes/${TAG}.md"
          if [ -f "$f" ]; then echo "path=$f" >> "$GITHUB_OUTPUT"; echo "notes: $f"; else echo "no $f; generated notes only"; fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          files: |
            dist/grayboard-*
            dist/install.sh
            dist/deploy-*
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
          fail_on_unmatched_files: true
