# Measures flake rates on CI's own runners: runs the root suite and the hosted
# matrix several times on one commit, in parallel. Dispatch only (#456):
#   gh workflow run flake-hunt.yml --ref <branch> -f reps='[1,2,3,4,5,6]'
# Any leg that fails on a commit that passed elsewhere is a flake; read the
# failed logs for the test names.
name: Flake hunt

on:
  workflow_dispatch:
    inputs:
      reps:
        description: JSON list with one entry per repetition
        default: "[1,2,3,4,5,6]"

permissions:
  contents: read

jobs:
  root:
    name: Root suite #${{ matrix.rep }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rep: ${{ fromJSON(inputs.reps) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          node: "true"
          release-cache: "true"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run test

  hosted:
    name: Hosted #${{ matrix.rep }}
    strategy:
      fail-fast: false
      matrix:
        rep: ${{ fromJSON(inputs.reps) }}
    uses: ./.github/workflows/hosted.yml
    with:
      rep: ${{ matrix.rep }}
