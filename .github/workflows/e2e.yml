name: E2E

# The slow and release-gating e2e suites, through scripts/e2e.sh: nightly, by
# hand, and from release.yml before a release publishes. A scheduled run that
# fails opens (or comments on) one tracking issue per suite.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite to run"
        type: choice
        options: [upgrade-matrix, hosted-live, hosted-public, hosted-network]
        default: upgrade-matrix
  workflow_call:
    inputs:
      suite:
        type: string
        required: true
      public_revision:
        description: "Public install commit; empty uses the triggering commit"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  e2e:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(github.event_name == 'schedule' && '["upgrade-matrix","hosted-live","hosted-public"]' || inputs.suite == 'hosted-network' && '["hosted-live","hosted-public"]' || format('["{0}"]', inputs.suite)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate public source commit
        if: matrix.suite == 'hosted-public'
        id: public
        env:
          REVISION: ${{ inputs.public_revision || github.sha }}
        run: |
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]] || { echo '::error::Public revision must be a full commit SHA.'; exit 1; }
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      # Compare installed bytes to the exact public commit under test.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.suite == 'hosted-public'
        with:
          ref: ${{ steps.public.outputs.revision }}
          persist-credentials: false

      - name: Require hosted package in the selected commit
        if: matrix.suite == 'hosted-public'
        run: |
          test -f adapters/opencode-v2/package.json || { echo '::error::Selected commit lacks the hosted package.'; exit 1; }

      - uses: ./.github/actions/setup
        with:
          node: "true"

      - name: Independent frozen hosted package install
        if: startsWith(matrix.suite, 'hosted-')
        working-directory: adapters/opencode-v2
        run: bun install --frozen-lockfile

      - name: Run ${{ matrix.suite }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # lifts the releases API's anonymous rate limit
          GRAYBOARD_E2E_RUN_DIR: ${{ runner.temp }}/e2e-run
          SUITE: ${{ matrix.suite }}
          GRAYBOARD_PUBLIC_REVISION: ${{ steps.public.outputs.revision }}
        run: scripts/e2e.sh "$SUITE"

      - name: Upload run dir
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/e2e-run/result
            ${{ runner.temp }}/e2e-run/evidence
            ${{ !startsWith(matrix.suite, 'hosted-') && format('{0}/e2e-run', runner.temp) || '' }}
          retention-days: 7
          if-no-files-found: warn

  # Its own job, so the tests never run with a token that can write issues.
  # scripts/e2e.sh leaves its verdict in the run dir's `result`; a run that
  # left none (it failed before the suite ran) counts as failed.
  tracking-issue:
    name: Tracking issue ${{ matrix.suite }}
    needs: e2e
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        suite: ["upgrade-matrix", "hosted-live", "hosted-public"]   # the schedule's suites, as in e2e's matrix
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: e2e-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: run

      - name: Open or comment on the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SUITE: ${{ matrix.suite }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          result="$(cat run/result 2>/dev/null || echo "failed: no result (the job failed before the suite finished)")"
          case "$result" in passed*) echo "$result"; exit 0 ;; esac
          title="Nightly e2e failing: $SUITE"
          body="Nightly \`scripts/e2e.sh $SUITE\` on ${SHA:0:7}: $result. $RUN_URL (the run dir is attached as an artifact for 7 days)."
          issue="$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
