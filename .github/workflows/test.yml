name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A new push to a PR cancels that PR's older runs (#507). Every other run gets
# a group of its own, so no push to master is ever cancelled or replaced.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('test-pr-{0}', github.event.pull_request.number) || format('test-run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  # A PR whose only change is .claude-plugin/marketplace.json (the release's
  # plugin-pin PR) runs the pin check below instead of the suites (#507). A PR
  # that changes only docs (files under docs/, or markdown outside adapters/
  # and plugins/, whose markdown ships in packages) runs the doc link check
  # instead (#601). The diff is of the run's own head commit against its base;
  # pushes and tags always run everything.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pin-only: ${{ steps.files.outputs.pin-only }}
      docs-only: ${{ steps.files.outputs.docs-only }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: files
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # A fork PR names its files, so they're printed with workflow
        # commands off: a name can't be read as one.
        run: |
          pin=false docs=false
          if [ -n "$HEAD" ]; then
            files="$(git diff --name-only "$BASE...$HEAD")"
            token="$(openssl rand -hex 16)"
            echo "::stop-commands::$token"
            printf '%s\n' "$files"
            echo "::$token::"
            [ "$files" = ".claude-plugin/marketplace.json" ] && pin=true
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^docs/|^[^/]*\.md$|^(\.github|\.claude|tests)/.*\.md$'; then docs=true; fi
          fi
          echo "pin-only=$pin" | tee -a "$GITHUB_OUTPUT"
          echo "docs-only=$docs" | tee -a "$GITHUB_OUTPUT"

  # The required "test" check. On a docs-only PR it runs the doc link check.
  # On a pin-only PR it checks the pin instead:
  # the marketplace tests, that the file is exactly the base's re-pinned to a
  # newer release (nothing else changed), and that the pinned tag is a
  # published, immutable release whose commit is the pinned sha.
  # A skipped required check counts as passed, so this job runs even when
  # scope fails, and then fails itself.
  test:
    needs: scope
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The Postgres store's tests (#807) create and drop their own databases here. Actions can't skip a service, so
    # docs-only and pin-only runs start it too (~10s).
    services:
      postgres:
        image: postgres:18.7@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
        env:
          POSTGRES_PASSWORD: gb
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      PIN_ONLY: ${{ needs.scope.outputs.pin-only }}
      SUITES: ${{ needs.scope.outputs.pin-only != 'true' && needs.scope.outputs.docs-only != 'true' }}
    steps:
      - name: Scope decided
        env:
          SCOPE: ${{ needs.scope.result }}
        run: test "$SCOPE" = success

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          node: ${{ env.SUITES == 'true' }}
          release-cache: ${{ env.SUITES == 'true' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        if: env.SUITES == 'true'
        run: bun run typecheck

      - name: Test
        if: env.SUITES == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # the upgrade tests list releases; lifts the anonymous rate limit
          GRAYBOARD_TEST_PG_URL: postgres://postgres:gb@127.0.0.1:5432/postgres
          GRAYBOARD_TEST_PG_REQUIRED: '1'   # a missing database fails the Postgres tests instead of skipping them
        run: bun run test

      - name: Doc links
        if: needs.scope.outputs.docs-only == 'true'
        run: bun test tests/integration/doc_links.test.ts

      - name: Marketplace tests
        if: env.PIN_ONLY == 'true'
        run: bun test tests/integration/claude_plugin_package.test.ts

      - name: The file only moves the pin forward
        if: env.PIN_ONLY == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          git show "$BASE:.claude-plugin/marketplace.json" > "$RUNNER_TEMP/base-marketplace.json"
          bun scripts/pin_claude_plugin.ts verify "$RUNNER_TEMP/base-marketplace.json"

      - name: The pin names an immutable release at its commit
        if: env.PIN_ONLY == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ref="$(jq -r '.plugins[0].source.ref' .claude-plugin/marketplace.json)"
          sha="$(jq -r '.plugins[0].source.sha' .claude-plugin/marketplace.json)"
          [ "$(gh release view "$ref" --json isImmutable --jq .isImmutable)" = true ] || { echo "::error::$ref isn't an immutable published release"; exit 1; }
          git fetch --no-tags origin "+refs/tags/${ref}:refs/tags/${ref}"
          tagged="$(git rev-parse "${ref}^{commit}")"
          [ "$tagged" = "$sha" ] || { echo "::error::$ref is $tagged, not the pinned $sha"; exit 1; }
          echo "$ref is immutable at $sha"

  # The server suite on Postgres (#807 P3 C11b): TestServer.open() clones a
  # database per server from the migrated template. The files already green on
  # Postgres (less mcp_subscriptions, a load flake candidate), with every tests/integration file that starts a TestServer,
  # the Stage 3 pilot gate service_invoke among them (#1523); C11c/C11d widen this to ./src/server ./tests/integration
  # ./tests/conformance. Non-required until C11d.
  test-pg:
    needs: scope
    if: needs.scope.outputs.pin-only != 'true' && needs.scope.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.7@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
        env:
          POSTGRES_PASSWORD: gb
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          node: true
          release-cache: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test on Postgres
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # the upgrade tests list releases; lifts the anonymous rate limit
          GRAYBOARD_TEST_PG_URL: postgres://postgres:gb@127.0.0.1:5432/postgres
          GRAYBOARD_TEST_PG_REQUIRED: '1'
          GRAYBOARD_TEST_BACKEND: pg
