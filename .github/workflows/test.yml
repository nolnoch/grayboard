name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # The pi end-to-end test runs the real pi CLI, which needs Node >= 22.19.
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # the upgrade tests list releases; lifts the anonymous rate limit
        run: bun test

  # deploy/grayboard.service as systemd reads it. verify also checks that the
  # user, env file and binary it names exist, so stand-ins go in first. It
  # exits 0 on some warnings, so any output fails the job.
  deploy-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: systemd-analyze verify
        run: |
          sudo useradd --system grayboard
          sudo install -D -m 600 /dev/null /etc/grayboard/env
          sudo install -m 755 /bin/true /usr/local/bin/grayboard-server
          out="$(systemd-analyze verify deploy/grayboard.service 2>&1)" || { echo "$out"; exit 1; }
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
