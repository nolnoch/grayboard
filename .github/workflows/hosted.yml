name: Hosted OpenCode

on:
  workflow_call:
    inputs:
      rep:
        description: Repetition label, for callers that run this workflow more than once in one run
        type: string
        default: ""
      skip:
        description: "true: run no suite, and Hosted required passes (a pin-only or docs-only PR, test.yml)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  hosted:
    name: ${{ matrix.suite }}
    if: ${{ !inputs.skip }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # scripts/e2e.sh suite names: the hosted OpenCode suites less the
        # outside-network ones (e2e.yml), and the real Claude Code with the
        # hosted plugin (#501; no credentials: a fake Anthropic API), and the
        # Rust client SDK against a real server (#929).
        suite: [hosted-strict, hosted-git, hosted-config, hosted-host, hosted-matrix, hosted-native, hosted-durable, claude-hosted, rust-sdk]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          node: "true"

      - name: Independent frozen package install
        if: startsWith(matrix.suite, 'hosted-')
        working-directory: adapters/opencode-v2
        run: bun install --frozen-lockfile

      - name: Cargo cache
        if: matrix.suite == 'rust-sdk'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sdk/rust/target
          key: rust-sdk-${{ runner.os }}-${{ hashFiles('sdk/rust/Cargo.lock', 'sdk/rust/rust-toolchain.toml') }}

      - name: Run ${{ matrix.suite }}
        env:
          GRAYBOARD_E2E_RUN_DIR: ${{ runner.temp }}/hosted-run
          SUITE: ${{ matrix.suite }}
        run: bash scripts/e2e.sh "$SUITE"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}${{ inputs.rep && format('-{0}', inputs.rep) || '' }}
          # A hosted suite's evidence only (never its fixture HOME or auth
          # store); claude-hosted's and rust-sdk's whole run dir, as e2e.yml
          # uploads it (rust-sdk's token is seeded in-process, never written).
          path: |
            ${{ runner.temp }}/hosted-run/evidence
            ${{ !startsWith(matrix.suite, 'hosted-') && format('{0}/hosted-run', runner.temp) || '' }}
          retention-days: 7
          if-no-files-found: warn

  required:
    name: Hosted required
    needs: hosted
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every hosted matrix leg to succeed
        env:
          RESULT: ${{ needs.hosted.result }}
          SKIP: ${{ inputs.skip }}
        run: |
          if [ "$RESULT" = success ]; then
            echo "Every hosted matrix leg passed."
          elif [ "$SKIP" = true ] && [ "$RESULT" = skipped ]; then
            echo "The caller skipped the hosted matrix (a pin-only or docs-only PR, #507, #601); nothing to require."
          else
            echo "::error::The hosted matrix result is '$RESULT', not success."
            exit 1
          fi
