name: Hosted OpenCode

on:
  workflow_call:

permissions:
  contents: read

jobs:
  hosted:
    name: Hosted ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [strict, git, config, public, host, live, matrix, native, durable]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          node: "true"

      - name: Independent frozen package install
        working-directory: adapters/opencode-v2
        run: bun install --frozen-lockfile

      - name: Run hosted ${{ matrix.suite }}
        env:
          GRAYBOARD_E2E_RUN_DIR: ${{ runner.temp }}/hosted-run
          GRAYBOARD_PUBLIC_REVISION: "5821ef7e50b96ba68e6f7a35068099937693d3a0"
          SUITE: ${{ matrix.suite }}
        run: bash scripts/e2e.sh "hosted-$SUITE"

      - name: Upload allowlisted evidence only
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hosted-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hosted-run/evidence
          retention-days: 7
          if-no-files-found: warn
