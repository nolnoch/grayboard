# New pi releases arrive as PRs, so the Test workflow runs the pi adapter's
# end-to-end test against them before anyone updates.
# Actions are pinned by commit SHA (#161; the repo requires it), so new
# releases arrive as PRs that move the SHA and its version comment together.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-name: "@earendil-works/pi-coding-agent"
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
