    <g id="hash" fill="none" stroke-linecap="butt" stroke-width="7">
      <path d="M57 38 L51.5 90"/>
      <path d="M78.5 38 L73 90"/>
      <path d="M40 55 H90"/>
      <path d="M38 73 H88"/>
