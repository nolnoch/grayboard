  <use href="#hash" transform="translate(64 64) scale(1.15) translate(-64 -64)" stroke="#2a18e8" opacity="0.85" filter="url(#glow)"/>
  <use href="#hash" transform="translate(64 64) scale(1.15) translate(-64 -64)" stroke="#0094ac"/>
